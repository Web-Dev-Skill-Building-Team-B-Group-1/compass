# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run the linter on the relevant version of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: ⚡ Angular Github CI

on:
  workflow_dispatch:
  push:
    branches: [master, main, develop]
  pull_request:
    types: [opened, synchronize]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: 🚀 Start Job
        run: echo "Job triggered by ${{ github.event_name }} event on ${{ github.ref }}"

      - name: 📂 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📊 Environment Info
        run: |
          echo "🖥️ Node version: $(node -v)"
          echo "📦 NPM version: $(npm -v)"
          echo "🏠 Working directory: $(pwd)"

      - name: ⚡ Cache Dependencies
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 📦 Install Dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: 🔍 Lint Code
        run: npm run lint

      - name: 🏗️ Build Project
        run: npm run build

      - name: 📋 List Distribution Files
        run: ls -la ./dist

      - name: 💾 Cache Build
        uses: actions/cache@v4
        with:
          path: ./dist
          key: ${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: 📝 Generate Build Report
        run: |
          echo "### 🏗️ Build Summary" > build-report.md
          echo "- 🌟 Branch: ${{ github.ref_name }}" >> build-report.md
          echo "- 🔄 Commit: ${{ github.sha }}" >> build-report.md
          echo "- 👤 Author: ${{ github.actor }}" >> build-report.md
          echo "- ⏱️ Time: $(date)" >> build-report.md

      - name: 📌 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 1

      - name: 🏁 Job Status
        run: echo "🏁 Job status is ${{ job.status }}"
